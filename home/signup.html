<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Harry Potter</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>

<body class="signup-body">
    <!--Back Button-->
    <a href="home/index.html" class="back-btn"><i class="fa-solid fa-chevron-left"></i></a>
    <div class="signup-container">
        <!--Logo-->
        <h1 class="hp-logo">Harry Potter</h1>
        <!--Section Title-->
        <div class="title-with-lines">
            <span></span>
            <h2>Sign Up</h2>
            <span></span>
        </div>
        <p class="subtitle">Enjoy the magical features including the official sorting ceremony,
            portriat maker and more!
        </p>
        <!--Sign Up Form-->
        <form id="signupForm" class="signup-form">
            <div class="form-group">
                <label for="dob">DATE OF BIRTH</label>
                <input type="text" id="dob" placeholder="DD/MM/YYYY" required>
            </div>
            <div class="form-group">
                <label for="email">EMAIL ADDRESS</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label for="password">PASSWORD</label>
                <div class="password-wrapper">
                    <input type="password" id="password" required>
                    <i class="fa-regular fa-eye" id="togglePassword"></i>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="firsName">FIRST NAME</label>
                    <input type="text" id="firstname" required>
                </div>
                <div class="form-group">
                    <label for="lastName">LAST NAME</label>
                    <input type="text" id="lastname" required>
                </div>
            </div>
            <p class="terms-text">By proceeding you agree to our <a href="#">Terms of Use</a> and
                acknowledge our <a href="#">Privacy Policy</a>.
            </p>
            <button type="submit" class="btn btn-solid-blue btn-full">SIGN UP</button>
            <p>Already have an account?</p>
            <button class="btn btn-outline btn-full" onclick="">LOG IN</button>
            </p>
            <div class="change-language">
                <i class="fa-solid fa-globe"></i>Change Language
            </div>
    </div>
    </form>
    </div>
    <script src="home/script.js"></script>
</body>

</html>
